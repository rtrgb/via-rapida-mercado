<body>
<header class="site-head"><div class="wrap"><a class="brand" href="./" aria-label="Via Rápida Mercado">via rápida<small>mercado</small></a></div></header>
<main class="wrap">
  <a class="back" href="./">Voltar</a>
  <div class="head"><h1>Aviso por e-mail</h1><span class="small">Você recebe um e-mail quando sair pão.</span></div>
  <form id="form" novalidate>
    <label for="nome">Nome<input id="nome" type="text" autocomplete="given-name" maxlength="80" required></label>
    <label for="email">E-mail<input id="email" type="email" autocomplete="email" maxlength="120" required></label>
    <label class="check" for="aceite"><input id="aceite" type="checkbox" required>Aceito receber avisos por e-mail</label>
    <p id="erro" class="erro" role="alert" hidden></p>
    <button id="enviar" class="btn btn-primary btn-block" type="submit">Me avise</button>
    <span class="small">Seu e-mail é usado só para estes avisos. Para sair, use o link no fim de qualquer aviso.</span>
  </form>
  <div id="ok" class="success" hidden><strong>Pronto!</strong><span class="small">Você vai receber um e-mail quando sair pão.</span></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
