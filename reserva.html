<head>
<meta charset="utf-8">

<meta name="description" content="Veja se tem pão francês agora na Via Rápida Mercado, receba aviso quando sair fornada e reserve. Rua 1400, 429, Balneário Camboriú.">

<meta property="og:url" content="https://rtrgb.github.io/via-rapida-mercado/reserva.html">
<meta property="og:image" content="https://rtrgb.github.io/via-rapida-mercado/img/compartilhar.png">

</head>
<body>
<header class="site-head"><div class="wrap"><a class="brand" href="./" aria-label="Via Rápida Mercado">via rápida<small>mercado</small></a></div></header>
<main class="wrap">
  <a class="back" href="./">Voltar</a>
  <h1>Reservar</h1>
  <form id="form" novalidate>
    <fieldset class="seg"><legend>Fornada</legend>
      <label for="agora"><input type="radio" name="fornada" id="agora" value="agora">Agora<small id="agora-info">carregando…</small></label>
      <label for="proxima"><input type="radio" name="fornada" id="proxima" value="proxima">Próxima<small id="proxima-info">–</small></label>
    </fieldset>
    <div class="campo"><span class="rotulo">Quantidade <span class="small">(máx. 10)</span></span>
      <div class="stepper"><button type="button" id="menos" aria-label="Diminuir">−</button><output id="qtd">4</output><button type="button" id="mais" aria-label="Aumentar">+</button></div></div>
    <label for="nome">Nome<input id="nome" type="text" autocomplete="name" maxlength="80" required></label>
    <label for="contato">E-mail ou telefone<input id="contato" type="text" autocomplete="email" maxlength="120" required></label>
    <p id="erro" class="erro" role="alert" hidden></p>
    <button id="enviar" class="btn btn-primary btn-block" type="submit">Reservar</button>
    <span class="small centro">Pague na retirada</span>
  </form>
  <section id="ok" class="pilha-lg" hidden>
    <div class="success"><strong id="ok-nome">Reservado</strong><span class="small">Mostre este código no caixa</span><span id="ok-codigo" class="code"></span></div>
    <div class="list">
      <div><span>Quantidade</span><span id="ok-qtd"></span></div>
      <div><span>Fornada</span><span id="ok-fornada"></span></div>
      <div><span>Retirar</span><span id="ok-prazo"></span></div>
    </div>
    <span class="small">Para mudar a quantidade ou cancelar, use "Minha reserva" com o mesmo e-mail ou telefone.</span>
    <div class="row"><a class="btn btn-ghost" href="./">Voltar</a><a class="btn btn-ghost" href="minha-reserva.html">Minha reserva</a></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/reserva.js"></script>
</body>
</html>
